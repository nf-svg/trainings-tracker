        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .status-label { font-size: 0.8rem; color: #999; }
        .status-value { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .card h2 { margin-bottom: 15px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .training-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .btn { padding: 10px 15px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        .password-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .password-form { text-align: center; }
        .password-form input { padding: 12px; font-size: 1rem; margin: 10px 0; border: 2px solid #667eea; border-radius: 6px; width: 200px; }
        .password-form button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
